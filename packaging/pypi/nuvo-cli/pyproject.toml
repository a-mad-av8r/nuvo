[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvo-cli"
version = "0.1.0"
description = "Explicit provider and Cortex configuration diagnostics for Nuvo"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["nuvo==0.1.0"]

[project.urls]
Homepage = "https://github.com/a-mad-av8r/nuvo"
Repository = "https://github.com/a-mad-av8r/nuvo"

[tool.setuptools]
packages = []
